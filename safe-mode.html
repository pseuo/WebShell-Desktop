<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全模式</title>
  <style>
    body { margin: 0; padding: 24px; color: #e5e7eb; background: linear-gradient(135deg,#020617,#7f1d1d); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { max-width: 720px; margin: auto; padding: 24px; border-radius: 22px; background: rgba(15,23,42,.9); box-shadow: 0 24px 70px rgba(0,0,0,.28); }
    h1 { margin: 0 0 12px; } p { color: #cbd5e1; line-height: 1.8; } button { margin: 8px 8px 0 0; border: 0; border-radius: 12px; padding: 11px 16px; color: #fff; background: #dc2626; font-weight: 800; cursor: pointer; } button.secondary { background: #334155; }
    pre { white-space: pre-wrap; word-break: break-all; color: #fecaca; }
  </style>
</head>
<body>
  <main><h1>安全模式</h1><p>应用检测到异常，已停止自动加载主站。你可以先修复或导出诊断。</p><pre id="reason"></pre><button id="cache">清理缓存并重启</button><button id="reset">重置窗口</button><button id="remote">禁用远程配置并重启</button><button class="secondary" id="diag">导出诊断包</button><button class="secondary" id="logs">打开日志</button><button class="secondary" id="license">授权中心</button></main>
  <script>
    window.desktopApi.getSafeModeInfo().then(info => { document.getElementById('reason').textContent = JSON.stringify(info, null, 2); });
    document.getElementById('cache').addEventListener('click', () => window.desktopApi.clearCacheRestart());
    document.getElementById('reset').addEventListener('click', () => window.desktopApi.resetWindowState());
    document.getElementById('remote').addEventListener('click', () => window.desktopApi.disableRemoteConfigRestart());
    document.getElementById('diag').addEventListener('click', () => window.desktopApi.exportDiagnosticsPackage());
    document.getElementById('logs').addEventListener('click', () => window.desktopApi.showLogs());
    document.getElementById('license').addEventListener('click', () => window.desktopApi.showLicense());
  </script>
</body>
</html>
