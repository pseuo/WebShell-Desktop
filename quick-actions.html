<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快捷操作</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; color: #f8fafc; background: linear-gradient(135deg,#0f172a,#1d4ed8); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    h1 { margin: 0 0 6px; }
    p { margin: 0 0 18px; color: #bfdbfe; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    button { min-height: 72px; border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 12px; color: #f8fafc; background: rgba(255,255,255,.12); cursor: pointer; font: inherit; font-weight: 800; text-align: left; box-shadow: 0 12px 30px rgba(2,6,23,.18); }
    button:hover { background: rgba(255,255,255,.2); }
  </style>
</head>
<body>
  <h1>快捷操作</h1>
  <p>快捷键 Ctrl+Alt+Space 打开此面板</p>
  <div class="grid">
    <button data-action="openHome">打开官网</button>
    <button data-action="reloadApp">刷新页面</button>
    <button data-action="clearCacheRestart">清理缓存并重启</button>
    <button data-action="toggleAlwaysOnTop">切换置顶</button>
    <button data-action="toggleMuted">切换静音</button>
    <button data-action="showSettings">打开设置</button>
    <button data-action="showLogs">打开日志</button>
    <button data-action="showFeedback">问题反馈</button>
    <button data-action="restartApp">重启应用</button>
  </div>
  <script>
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => window.desktopApi[button.dataset.action]());
    });
  </script>
</body>
</html>
