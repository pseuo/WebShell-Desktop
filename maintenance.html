<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>维护模式</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #0f172a; background: radial-gradient(circle at top,#dbeafe,#f8fafc 58%); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { width: min(680px, calc(100vw - 36px)); padding: 28px; border-radius: 24px; background: rgba(255,255,255,.9); box-shadow: 0 24px 70px rgba(15,23,42,.12); }
    h1 { margin: 0 0 12px; } p { color: #475569; line-height: 1.8; } button { margin: 8px 8px 0 0; border: 0; border-radius: 12px; padding: 11px 16px; color: #fff; background: #2563eb; font-weight: 800; cursor: pointer; }
    button.secondary { color: #1e293b; background: #e2e8f0; }
  </style>
</head>
<body>
  <main><h1 id="title"></h1><p id="message"></p><p id="extra"></p><button id="retry">重试</button><button class="secondary" id="config">配置中心</button><button class="secondary" id="license">授权中心</button><button class="secondary" id="diag">导出诊断包</button></main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('title').textContent = params.get('title') || '服务维护中';
    document.getElementById('message').textContent = params.get('message') || '服务维护中，请稍后再试。';
    document.getElementById('extra').textContent = [params.get('eta') && `预计恢复：${params.get('eta')}`, params.get('contact') && `联系方式：${params.get('contact')}`].filter(Boolean).join('  ');
    document.getElementById('retry').addEventListener('click', () => window.desktopApi.reloadApp());
    document.getElementById('config').addEventListener('click', () => window.desktopApi.showRemoteConfig());
    document.getElementById('license').addEventListener('click', () => window.desktopApi.showLicense());
    document.getElementById('diag').addEventListener('click', () => window.desktopApi.exportDiagnosticsPackage());
  </script>
</body>
</html>
