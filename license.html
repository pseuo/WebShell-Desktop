<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权中心</title>
  <style>
    body { margin: 0; padding: 24px; color: #0f172a; background: linear-gradient(135deg,#f8fafc,#ecfeff); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    body.drag { outline: 4px dashed #2563eb; outline-offset: -12px; }
    h1 { margin: 0 0 16px; }
    button { margin: 0 10px 14px 0; border: 0; border-radius: 12px; padding: 11px 16px; color: #fff; background: #2563eb; cursor: pointer; font-weight: 800; }
    button.secondary { color: #1e293b; background: #e2e8f0; }
    .card { margin-bottom: 16px; padding: 18px; border-radius: 18px; color: #fff; background: linear-gradient(135deg,#2563eb,#0891b2); box-shadow: 0 14px 36px rgba(37,99,235,.22); }
    .progress { overflow: hidden; height: 10px; border-radius: 999px; background: rgba(255,255,255,.3); } .bar { height: 100%; width: 0; background: #fff; }
    dl { display: grid; grid-template-columns: 180px 1fr; overflow: hidden; border-radius: 16px; background: rgba(255,255,255,.9); box-shadow: 0 10px 30px rgba(15,23,42,.06); }
    dt, dd { margin: 0; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
    dt { color: #64748b; background: #f8fafc; }
    pre { white-space: pre-wrap; word-break: break-all; }
    @media (prefers-color-scheme: dark) { body { color: #e5e7eb; background: #020617; } dl { background: #0f172a; } dt { color: #94a3b8; background: #111827; } dt,dd { border-color: #1e293b; } button.secondary { color: #e5e7eb; background: #334155; } }
  </style>
</head>
<body>
  <h1>授权中心</h1>
  <button id="check">校验授权</button>
  <button id="import">导入本地授权</button>
  <button class="secondary" id="clear">清除本地授权</button>
  <button class="secondary" id="clearUniversal">清除通用授权</button>
  <button class="secondary" id="request">导出授权申请</button>
  <button class="secondary" id="copyDevice">复制设备 ID</button>
  <button class="secondary" id="copyStatus">复制授权状态</button>
  <button class="secondary" id="openLocal">打开本地授权目录</button>
  <button class="secondary" id="openRequest">打开授权申请目录</button>
  <div class="card"><h2 id="state">授权状态</h2><p id="summary"></p><div class="progress"><div class="bar" id="bar"></div></div></div>
  <dl id="info"></dl>
  <script>
    const labels = { license:'当前授权', localLicense:'本地授权', localLicenseInfo:'本地授权信息', licenseServerState:'服务端状态', deviceState:'设备信息', settings:'授权设置' };
    function text(value) { return typeof value === 'object' ? `<pre>${JSON.stringify(value, null, 2)}</pre>` : String(value ?? '-'); }
    async function load() {
      const data = await window.desktopApi.getLicenseCenterInfo();
      document.getElementById('state').textContent = data.license.valid ? '授权有效' : '授权异常';
      document.getElementById('summary').textContent = `${data.license.reason || '-'} ${data.license.universal ? ' / 通用授权' : ''} ${data.localLicenseInfo.signatureVerified ? ' / 已签名' : ''}`;
      document.getElementById('bar').style.width = data.license.daysLeft == null ? '100%' : `${Math.max(0, Math.min(100, data.license.daysLeft / 30 * 100))}%`;
      document.getElementById('info').innerHTML = Object.entries(data).map(([key, value]) => `<dt>${labels[key] || key}</dt><dd>${text(value)}</dd>`).join('');
    }
    document.getElementById('check').addEventListener('click', async () => { await window.desktopApi.checkLicense(); load(); });
    document.getElementById('import').addEventListener('click', async () => { await window.desktopApi.importLocalLicense(); load(); });
    document.getElementById('clear').addEventListener('click', async () => { await window.desktopApi.clearLocalLicense(); load(); });
    document.getElementById('clearUniversal').addEventListener('click', async () => { await window.desktopApi.clearUniversalLicense(); load(); });
    document.getElementById('request').addEventListener('click', () => window.desktopApi.exportLicenseRequest());
    document.getElementById('copyDevice').addEventListener('click', () => window.desktopApi.copyDeviceId());
    document.getElementById('copyStatus').addEventListener('click', () => window.desktopApi.copyLicenseStatus());
    document.getElementById('openLocal').addEventListener('click', () => window.desktopApi.openLocalLicenseFolder());
    document.getElementById('openRequest').addEventListener('click', () => window.desktopApi.openLicenseRequestFolder());
    window.addEventListener('dragover', event => { event.preventDefault(); document.body.classList.add('drag'); });
    window.addEventListener('dragleave', () => document.body.classList.remove('drag'));
    window.addEventListener('drop', async event => {
      event.preventDefault();
      document.body.classList.remove('drag');
      const file = event.dataTransfer.files[0];
      if (file) { await window.desktopApi.importLocalLicenseFile(file.path); load(); }
    });
    load();
  </script>
</body>
</html>
