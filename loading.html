<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在启动</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #172554;
      background: radial-gradient(circle at 20% 20%, #bfdbfe, transparent 34%), linear-gradient(135deg, #f8fafc, #e0f2fe);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(460px, 100%);
      padding: 34px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(30, 64, 175, 0.16);
      text-align: center;
    }

    .spinner {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border: 5px solid #dbeafe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0;
      color: #64748b;
      line-height: 1.7;
    }

    .bar {
      height: 6px;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 999px;
      background: #dbeafe;
    }

    .bar::before {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: #2563eb;
      animation: load 1.2s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes load {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(260%);
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #e5e7eb;
        background: radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.34), transparent 34%), linear-gradient(135deg, #020617, #0f172a);
      }

      main {
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }

      p {
        color: #94a3b8;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1>正在启动 WebShell Desktop</h1>
    <p>正在连接服务，请稍候。</p>
    <div class="bar"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const targetUrl = params.get('url') || 'https://ai.boxrom.com/';

    setTimeout(() => {
      location.href = targetUrl;
    }, 300);
  </script>
</body>
</html>
