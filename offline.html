<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面加载失败</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #1f2937;
      background: linear-gradient(135deg, #eef2ff, #f8fafc 45%, #ecfeff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(520px, 100%);
      padding: 36px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    .mark {
      width: 64px;
      height: 64px;
      display: inline-grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 20px;
      color: #2563eb;
      background: #dbeafe;
      font-size: 32px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #64748b;
      line-height: 1.7;
    }

    .error {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      color: #475569;
      background: #f1f5f9;
      word-break: break-word;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    button:hover {
      background: #1d4ed8;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #e5e7eb;
        background: linear-gradient(135deg, #020617, #0f172a 45%, #164e63);
      }

      main {
        border-color: rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.84);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
      }

      p {
        color: #94a3b8;
      }

      .error {
        color: #cbd5e1;
        background: rgba(30, 41, 59, 0.9);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">!</div>
    <h1>页面加载失败</h1>
    <p>请检查网络连接，或稍后重试。</p>
    <div class="error" id="error">正在读取错误信息...</div>
    <div class="error" id="network">网络状态：读取中...</div>
    <div class="error" id="lastOnline">最后在线时间：读取中...</div>
    <div class="error" id="countdown">自动重试倒计时：10 秒</div>
    <button id="retry" type="button">重新加载</button>
    <button id="logs" type="button">打开日志</button>
    <button id="repair" type="button">清理缓存并重试</button>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const targetUrl = params.get('url') || 'https://ai.boxrom.com/';
    const error = params.get('error') || '网络连接不可用';

    document.getElementById('error').textContent = error;
    document.getElementById('retry').addEventListener('click', () => {
      location.href = targetUrl;
    });
    document.getElementById('logs').addEventListener('click', () => window.desktopApi.openLogs && window.desktopApi.openLogs());
    document.getElementById('repair').addEventListener('click', () => window.desktopApi.clearCacheRestart());

    if (window.desktopApi) {
      window.desktopApi.getOfflineInfo().then(info => {
        document.getElementById('network').textContent = `网络状态：${info.network}`;
        document.getElementById('lastOnline').textContent = `最后在线时间：${info.lastOnlineAt || '暂无记录'}`;
      });
    }

    let seconds = 10;
    setInterval(() => {
      seconds -= 1;
      if (seconds <= 0) location.href = targetUrl;
      document.getElementById('countdown').textContent = `自动重试倒计时：${seconds} 秒`;
    }, 1000);
  </script>
</body>
</html>
