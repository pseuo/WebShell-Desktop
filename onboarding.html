<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首次使用引导</title>
  <style>
    body { margin: 0; padding: 30px; color: #0f172a; background: linear-gradient(135deg,#eef2ff,#f8fafc); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { max-width: 760px; margin: auto; }
    h1 { margin-top: 0; font-size: 30px; }
    .grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .card { padding: 18px; border-radius: 18px; background: rgba(255,255,255,.86); box-shadow: 0 12px 34px rgba(15,23,42,.08); }
    h2 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; color: #64748b; line-height: 1.7; }
    button { margin-top: 22px; width: 100%; border: 0; border-radius: 14px; padding: 14px; color: #fff; background: #2563eb; font-weight: 800; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { color: #e5e7eb; background: linear-gradient(135deg,#020617,#0f172a); } .card { background: rgba(15,23,42,.86); } p { color: #94a3b8; } }
  </style>
</head>
<body>
  <main>
    <h1>欢迎使用 WebShell Desktop</h1>
    <div class="grid">
      <section class="card"><h2>托盘运行</h2><p>关闭窗口默认会最小化到托盘，可通过托盘菜单显示或退出。</p></section>
      <section class="card"><h2>快捷键</h2><p>默认使用 Ctrl+Alt+A 显示或隐藏窗口，可在设置中修改。</p></section>
      <section class="card"><h2>设置入口</h2><p>右键托盘图标打开设置，可配置启动、关闭行为、权限、URL 和快捷键。</p></section>
      <section class="card"><h2>清理缓存</h2><p>页面异常时可在托盘菜单或设置窗口执行清理缓存并重启。</p></section>
      <section class="card"><h2>日志位置</h2><p>日志保存在 userData 目录，也可通过托盘菜单打开日志查看器。</p></section>
      <section class="card"><h2>诊断导出</h2><p>遇到问题时可导出诊断信息，包含日志、设置、系统和版本信息。</p></section>
    </div>
    <button id="done">我知道了</button>
  </main>
  <script>document.getElementById('done').addEventListener('click', () => window.desktopApi.finishOnboarding());</script>
</body>
</html>
