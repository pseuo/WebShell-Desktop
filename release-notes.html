<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新说明</title>
  <style>
    body { margin: 0; min-height: 100vh; padding: 30px; color: #0f172a; background: linear-gradient(135deg,#eef2ff,#f8fafc); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { max-width: 720px; margin: auto; padding: 24px; border-radius: 22px; background: rgba(255,255,255,.9); box-shadow: 0 18px 48px rgba(15,23,42,.1); }
    h1 { margin: 0 0 8px; }
    .version { color: #64748b; margin-bottom: 18px; }
    pre { white-space: pre-wrap; line-height: 1.8; font: inherit; }
    @media (prefers-color-scheme: dark) { body { color: #e5e7eb; background: linear-gradient(135deg,#020617,#111827); } main { background: rgba(15,23,42,.9); } .version { color: #94a3b8; } }
  </style>
</head>
<body>
  <main><h1 id="title"></h1><div class="version" id="version"></div><pre id="body"></pre></main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('title').textContent = params.get('title') || '更新说明';
    document.getElementById('version').textContent = `版本：${params.get('version') || '-'}`;
    document.getElementById('body').textContent = params.get('body') || '暂无更新说明。';
  </script>
</body>
</html>
